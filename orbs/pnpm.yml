version: 2.1

orbs:
    utils: arrai/utils@1.23.0

executors:
    current:
        environment:
            LANG: en_US.UTF-8
        docker:
            - image: cimg/node:current
    lts:
        environment:
            LANG: en_US.UTF-8
        docker:
            - image: cimg/node:lts

aliases:
    common_npm_config_parameters: &common_npm_config_parameters
        npm_registry:
            description: "The npm registry to authenticate against."
            type: string
            default: "registry.npmjs.org"
        npm_token:
            description: "Auth token for the registry."
            type: string
            default: ${NPM_TOKEN}
        npm_scopes:
            description: "Newline separated scope-to-registry mappings to add to .npmrc (e.g. @arrai-innovations:registry=https://npm.arrai.dev/)."
            type: string
            default: ""

    common_audit_parameters: &common_audit_parameters
        wd:
            description: "Directory to run pnpm audit from. For a pnpm workspace, leave at the repo root to audit all packages."
            type: string
            default: ~/project
        executor:
            type: executor
            default: lts
        resource_class:
            description: "The resource class to use for the job."
            type: enum
            enum: [small, medium, medium+, large, xlarge, 2xlarge, 2xlarge+]
            default: small
        setup:
            description: "Any additional setup steps."
            type: steps
            default: []
        config:
            description: "Any additional configuration steps."
            type: steps
            default: []
        skip_dev:
            description: "Don't check development dependencies."
            type: boolean
            default: true
        create_badges:
            description: "Generate badges."
            type: boolean
            default: true

    common_publish_parameters: &common_publish_parameters
        wd:
            description: "Directory of the package to publish. In a pnpm workspace, set this to the package subdir; pnpm install always runs at the repo root so the workspace resolves correctly."
            type: string
            default: ~/project
        executor:
            type: executor
            default: lts
        resource_class:
            description: "The resource class to use for the job."
            type: enum
            enum: [small, medium, medium+, large, xlarge, 2xlarge, 2xlarge+]
            default: small
        setup:
            description: "Any additional setup steps."
            type: steps
            default: []
        oidc:
            description: "Publish via CircleCI OIDC trusted publishing. Only supported by npmjs.org; set to false to authenticate to another registry with a token."
            type: boolean
            default: true
        npm_version:
            description: "npm version to upgrade to for the OIDC publish (needs >= 11.5.1 for trusted publishing). Pinned below 12 because npm 12.0.0 ships without the sigstore module and crashes on publish."
            type: string
            default: "11"

    common_audit_steps: &common_audit_steps
        - checkout
        - steps: <<parameters.setup>>
        - install_pnpm
        - utils/add_npm_config:
              registry: <<parameters.npm_registry>>
              token: <<parameters.npm_token>>
              scopes: <<parameters.npm_scopes>>
        - steps: <<parameters.config>>
        - run:
              name: "Run pnpm audit."
              command: |
                  cd <<parameters.wd>>
                  pnpm audit <<# parameters.skip_dev >>--prod<</ parameters.skip_dev >>
        - when:
              condition: <<parameters.create_badges>>
              steps:
                  - utils/add_ssh_config
                  - utils/make_status_shield:
                        when: on_fail
                        status: errors
                        color: red
                        logo: pnpm
                  - utils/make_status_shield:
                        when: on_success
                        status: passed
                        color: brightgreen
                        logo: pnpm
                  - utils/rsync_file:
                        when: always
                        file: ~/status.svg
                        remote_file: ${CIRCLE_BRANCH}/pnpm-audit.svg
                        host: docs

    common_publish_steps: &common_publish_steps
        - checkout
        - steps: <<parameters.setup>>
        - install_pnpm
        - when:
              condition:
                  not: <<parameters.oidc>>
              steps:
                  - utils/add_npm_config:
                        registry: <<parameters.npm_registry>>
                        token: <<parameters.npm_token>>
                        scopes: <<parameters.npm_scopes>>
        - run:
              name: "Install Packages."
              command: pnpm install --frozen-lockfile
        - when:
              condition: <<parameters.oidc>>
              steps:
                  # pnpm publish is implemented natively since v11 and does not
                  # perform the npm OIDC token exchange, so pack with pnpm (to
                  # resolve workspace protocols) and publish the tarball with the
                  # npm CLI, which reads NPM_ID_TOKEN. Requires npm >= 11.5.1;
                  # pinned below 12 because npm 12.0.0 is missing sigstore.
                  - utils/upgrade_npm:
                        version: <<parameters.npm_version>>
                  - run:
                        name: "Publish to npm via OIDC trusted publishing."
                        command: |
                            cd <<parameters.wd>>
                            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:<<parameters.npm_registry>>"}')
                            TARBALL="$(pnpm pack | tail -n 1)"
                            npm publish "${TARBALL}"
        - when:
              condition:
                  not: <<parameters.oidc>>
              steps:
                  - run:
                        name: "Publish to npm."
                        command: |
                            cd <<parameters.wd>>
                            pnpm publish --no-git-checks

commands:
    install_pnpm:
        description: "Ensure pnpm is installed."
        steps:
            - run:
                  name: "Install pnpm."
                  command: |
                      if ! [ -x "$(command -v pnpm)" ]; then
                          npm install -g pnpm
                      fi
                      pnpm --version

jobs:
    audit:
        parameters:
            <<: [*common_audit_parameters, *common_npm_config_parameters]
        executor: <<parameters.executor>>
        resource_class: <<parameters.resource_class>>
        circleci_ip_ranges: false
        steps: *common_audit_steps

    audit_fixed_ip:
        parameters:
            <<: [*common_audit_parameters, *common_npm_config_parameters]
        executor: <<parameters.executor>>
        resource_class: <<parameters.resource_class>>
        circleci_ip_ranges: true
        steps: *common_audit_steps

    publish:
        parameters:
            <<: [*common_npm_config_parameters, *common_publish_parameters]
        executor: <<parameters.executor>>
        resource_class: <<parameters.resource_class>>
        steps: *common_publish_steps

    publish_fixed_ip:
        parameters:
            <<: [*common_npm_config_parameters, *common_publish_parameters]
        executor: <<parameters.executor>>
        resource_class: <<parameters.resource_class>>
        circleci_ip_ranges: true
        steps: *common_publish_steps
